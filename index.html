<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fef7ff" />
    <title>Savings Table Pet</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell" id="app">
      <header class="appbar">
        <div class="appbar-title">
          <div class="companion" id="petWindow">
            <header class="pet-window-header" id="petWindowHeader" hidden>
              <div class="pet-window-actions">
                <button id="pinBtn" type="button">置顶</button>
                <button id="collapseBtn" type="button">收起</button>
              </div>
            </header>
            <div class="pet-window-body" id="petWindowBody">
              <div class="pet-stage" id="petStage" data-pet-state="idle">
                <img id="petImage" alt="陪伴角色" />
                <div class="placeholder" id="petPlaceholder">🐾</div>
              </div>
            </div>
          </div>
          <h1>储蓄陪伴</h1>
        </div>
        <div class="appbar-balance">
          <span>当前储蓄</span>
          <strong id="balanceText">¥0.00</strong>
        </div>
      </header>

      <main class="views">
        <section class="view is-active" data-view="home">
          <section class="goal-zone">
            <p class="zone-label">当前目标</p>
            <p class="goal-name" id="goalNameText">-</p>
            <p class="goal-amount" id="goalAmountText">¥0.00 / ¥0.00</p>
            <div class="progress-wrap">
              <div class="progress-bar" id="goalProgressBar"></div>
            </div>
            <div class="goal-meta">
              <span id="goalProgressText">0%</span>
              <span id="goalRemainingText">剩余：¥0.00</span>
            </div>
            <details class="fold">
              <summary>编辑目标</summary>
              <form id="goalForm" class="stack-form">
                <label>
                  目标名称
                  <input id="goalNameInput" type="text" maxlength="40" required />
                </label>
                <label>
                  目标金额
                  <input id="goalAmountInput" type="number" min="0.01" step="0.01" required />
                </label>
                <button type="submit">更新目标</button>
              </form>
              <p class="hint" id="goalStageText">陪伴阶段：初识</p>
            </details>
          </section>

          <section class="quick-zone">
            <p class="zone-label">快速储蓄</p>
            <div class="actions" id="actionsContainer"></div>
          </section>
        </section>

        <section class="view" data-view="records">
          <p class="zone-label">记录一笔</p>
          <form id="manualForm" class="stack-form">
            <label>
              场景
              <select id="manualActionType"></select>
            </label>
            <label>
              金额
              <input id="manualAmount" type="number" min="0" step="0.01" required />
            </label>
            <label>
              分类
              <input id="manualCategory" type="text" maxlength="30" placeholder="如：饮食、交通" />
            </label>
            <label>
              标签（逗号分隔）
              <input id="manualTags" type="text" maxlength="80" placeholder="午餐,日常" />
            </label>
            <label>
              备注
              <input id="manualNote" type="text" maxlength="120" placeholder="可选" />
            </label>
            <button type="submit">保存记录</button>
          </form>

          <p class="zone-label">历史记录</p>
          <input id="searchInput" type="text" maxlength="80" placeholder="搜索备注 / 分类 / 标签" />
          <ul class="history-list" id="historyList"></ul>
        </section>

        <section class="view" data-view="stats">
          <p class="zone-label">月预算</p>
          <form id="budgetForm" class="stack-form inline">
            <label>
              本月预算
              <input id="budgetInput" type="number" min="0" step="0.01" />
            </label>
            <button type="submit">更新</button>
          </form>
          <p class="hint" id="budgetText">本月预算：-</p>

          <p class="zone-label">摘要</p>
          <div class="summary-grid">
            <article>
              <h3>今日</h3>
              <p id="dailySummary">¥0.00</p>
            </article>
            <article>
              <h3>本周</h3>
              <p id="weeklySummary">¥0.00</p>
            </article>
            <article>
              <h3>本月</h3>
              <p id="monthlySummary">¥0.00</p>
            </article>
          </div>

          <p class="zone-label">分类统计</p>
          <div class="chart" id="categoryChart"></div>
        </section>

        <section class="view" data-view="more">
          <p class="zone-label">角色设置</p>
          <div class="stack-form">
            <label>
              皮肤
              <select id="petSkinSelect"></select>
            </label>
            <label>
              尺寸
              <select id="petSizeSelect">
                <option value="sm">小</option>
                <option value="md">中</option>
                <option value="lg">大</option>
              </select>
            </label>
            <label class="switch">
              <input type="checkbox" id="soundToggle" />
              动画音效
            </label>
          </div>

          <p class="zone-label">陪伴详情</p>
          <div class="stats">
            <span>阶段 <strong id="petHomeStageBadge">初识</strong></span>
            <span>状态 <strong id="petStateText">待机</strong></span>
            <span>等级 <strong id="levelText">1</strong></span>
            <span>亲密度 <strong id="affinityText">0</strong></span>
            <span>积分 <strong id="coinsText">0</strong></span>
          </div>
          <div class="level-line">
            <span>经验</span>
            <div class="progress-wrap grow">
              <div class="progress-bar" id="expProgress"></div>
            </div>
            <span id="expText">0/100</span>
          </div>
          <details class="fold">
            <summary>里程碑</summary>
            <ul class="milestones" id="milestonesList"></ul>
          </details>

          <p class="zone-label">数据</p>
          <div class="data-actions">
            <button id="exportBtn" type="button">导出</button>
            <button id="importBtn" type="button">导入</button>
          </div>
          <textarea id="jsonArea" rows="6" placeholder="在这里粘贴或复制 JSON"></textarea>
        </section>
      </main>

      <nav class="tabbar">
        <button class="tab-btn is-active" data-tab="home" type="button">🏠<span>首页</span></button>
        <button class="tab-btn" data-tab="records" type="button">📝<span>记录</span></button>
        <button class="tab-btn" data-tab="stats" type="button">📊<span>统计</span></button>
        <button class="tab-btn" data-tab="more" type="button">⚙️<span>更多</span></button>
      </nav>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
